# Tests + backtest football sur données réelles (football-data.co.uk), sans aucune clé.
# Se lance à chaque pull request qui touche football/, ou à la main (« Run workflow »).
# Le tableau des résultats s'affiche dans l'onglet « Summary » de l'exécution.
name: Football - tests et backtest

on:
  pull_request:
    paths:
      - "football/**"
      - ".github/workflows/football_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/backtest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backtest-football
          path: football/reports/backtest.md
