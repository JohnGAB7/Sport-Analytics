# Registre quotidien de paris FICTIFS football (aucune mise réelle).
# Utilise le même secret que la NBA : ODDS_API_KEY (The Odds API).
# Settings > Secrets and variables > Actions.
name: Football - paris fictifs quotidiens

on:
  schedule:
    - cron: "0 8 * * *"    # 08:00 UTC : avant les matchs européens de la journée
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

# Aucun droit par défaut ; le job ci-dessous ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: football-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # uniquement pour enregistrer le registre dans le dépôt
      issues: write          # pour publier le bilan du jour (GitHub l'envoie par e-mail)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # le jeton n'est pas laissé dans .git pendant pip/pytest
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Mettre à jour le registre
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/daily_update.py
      - name: Enregistrer le registre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add registry
          git diff --cached --quiet && exit 0
          git commit -m "Registre football du $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Publier le bilan du jour (e-mail via les notifications GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -f reports/digest.md ] || { echo "Rien de nouveau : pas de bilan."; exit 0; }
          gh label create bilan-quotidien --color 0E8A16 --description "Bilan quotidien des paris fictifs" --force
          num=$(gh issue list --label bilan-quotidien --state open --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --title "Bilan quotidien des paris fictifs" --label bilan-quotidien \
              --assignee "$OWNER" --body "Chaque jour où il y a du nouveau, le bilan est publié ici en commentaire. La personne assignée le reçoit par e-mail (notifications GitHub).")
            num=${url##*/}
          fi
          gh issue comment "$num" --body-file reports/digest.md
