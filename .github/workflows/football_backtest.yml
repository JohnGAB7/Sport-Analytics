# Tests + backtest football sur données réelles (football-data.co.uk), sans aucune clé.
# Se lance à chaque pull request qui touche football/, ou à la main (« Run workflow »).
# Le tableau des résultats s'affiche dans l'onglet « Summary » de l'exécution.
name: Football - tests et backtest

on:
  pull_request:
    paths:
      - "football/**"
      - ".github/workflows/football_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/backtest.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backtest-football
          path: football/reports/backtest.md
