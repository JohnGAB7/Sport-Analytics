[project]
name = "football-analytics"
version = "0.1.0"
description = "Prévisions 1X2 de football et paris fictifs, sans mise d'argent réelle."
requires-python = ">=3.10"

[tool.pytest.ini_options]
# Permet à pytest de trouver le paquet dans src/ sans installation.
pythonpath = ["src"]
testpaths = ["tests"]
