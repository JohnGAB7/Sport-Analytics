# Registre quotidien de paris FICTIFS NBA (aucune mise réelle).
# Clés à créer dans GitHub : Settings > Secrets and variables > Actions >
#   BDL_API_KEY (BALLDONTLIE) et ODDS_API_KEY (The Odds API).
name: NBA - paris fictifs quotidiens

on:
  # EN PAUSE (12/11/2026) : lancement quotidien désactivé à la demande de JG.
  # Pour reprendre, remettre les deux lignes suivantes :
  # schedule:
  #   - cron: "0 16 * * *"
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

# Aucun droit par défaut ; le job ci-dessous ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # uniquement pour enregistrer le registre dans le dépôt
    timeout-minutes: 120     # le premier passage télécharge ~10 saisons (environ 30 min)
    defaults:
      run:
        working-directory: nba
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # le jeton n'est pas laissé dans .git pendant pip/pytest
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Mettre à jour le registre
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/daily_update.py
      - name: Enregistrer le registre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add registry
          git diff --cached --quiet || git commit -m "Registre NBA du $(date -u +%Y-%m-%d)"
          git push
