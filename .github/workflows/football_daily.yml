# Registre quotidien de paris FICTIFS football (aucune mise réelle).
# Utilise le même secret que la NBA : ODDS_API_KEY (The Odds API).
# Settings > Secrets and variables > Actions.
name: Football - paris fictifs quotidiens

on:
  schedule:
    - cron: "0 8 * * *"    # 08:00 UTC : avant les matchs européens de la journée
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

# Aucun droit par défaut ; le job ci-dessous ne reçoit que ce dont il a besoin.
permissions: {}

concurrency:
  group: football-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # uniquement pour enregistrer le registre dans le dépôt
    timeout-minutes: 30
    defaults:
      run:
        working-directory: football
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton n'est pas laissé dans .git pendant pip/pytest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Mettre à jour le registre
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/daily_update.py
      - name: Enregistrer le registre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add registry
          git diff --cached --quiet && exit 0
          git commit -m "Registre football du $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
